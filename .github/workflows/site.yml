name: Generate & Deploy Site

on:
  schedule:
    - cron: '0 19 * * *'   # 06:00 Nouvelle-Calédonie (UTC+11)
  push:
    branches: [main]
    paths-ignore:
      - 'tests/**'
      - 'src/**'
      - '*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'tests/**'
      - 'src/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Fetch menu data
        run: uv run python scripts/fetch_data.py

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Astro deps
        run: bun install --frozen-lockfile
        working-directory: site

      - name: Build site
        run: bun run build
        working-directory: site

      - name: Install Chrome for pa11y
        run: node node_modules/puppeteer/install.mjs
        working-directory: site

      - name: Accessibility audit (pa11y, WCAG2AA)
        run: bun run a11y
        working-directory: site

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
